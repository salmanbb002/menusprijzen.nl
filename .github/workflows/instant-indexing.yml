name: Instant Indexing

on:
  push:
    branches: [main]
  schedule:
    # Daily safety-net run to resubmit the sitemap in case a push was missed
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Specific URLs to submit (space separated). Leave empty to submit the full sitemap."
        required: false

env:
  SITE_URL: https://menusprijzen.nl

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit URLs to IndexNow + Google Indexing API
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            node scripts/instant-index.mjs ${{ github.event.inputs.urls }}
          else
            node scripts/instant-index.mjs --sitemap "${{ env.SITE_URL }}/sitemap.xml"
          fi
